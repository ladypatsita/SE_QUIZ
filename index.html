        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const rationaleContainer = document.getElementById('rationale-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const counterText = document.getElementById('question-counter');
        const scoreText = document.getElementById('score-counter');
        
        const mapModal = document.getElementById('map-modal');
        const mapBtn = document.getElementById('map-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const mapGrid = document.getElementById('map-grid');

        function renderQuestion() {
            const q = questions[currentIndex];
            counterText.innerText = `ข้อที่ ${currentIndex + 1} / ${questions.length}`;
            questionText.innerText = q.question;
            
            optionsContainer.innerHTML = '';
            rationaleContainer.classList.add('hidden');
            rationaleContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-vector px-5 py-4 w-full text-lg';
                btn.innerText = opt;
                
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (index === q.answerIndex) {
                        btn.classList.add('btn-correct');
                    } else if (index === userAnswers[currentIndex]) {
                        btn.classList.add('btn-wrong');
                    }
                } else {
                    btn.onclick = () => selectAnswer(index);
                }
                
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                showRationale();
            }

            prevBtn.style.visibility = currentIndex > 0 ? 'visible' : 'hidden';
            nextBtn.innerHTML = currentIndex === questions.length - 1 ? 'สิ้นสุดการทำสอบ' : 'ถัดไป &raquo;';
            
            updateScore();
            renderMap();
        }

        function selectAnswer(selectedIndex) {
            const q = questions[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            
            if (selectedIndex === q.answerIndex) {
                score++;
            }
            renderQuestion(); 
        }

        function showRationale() {
            const q = questions[currentIndex];
            let html = `<p class="font-bold text-[#60a5fa] mb-3 text-lg">💡 เฉลยและคำอธิบาย:</p>`;
            if (Array.isArray(q.rationale)) {
                html += q.rationale.join('<br><br>');
            } else {
                html += q.rationale;
            }
            rationaleContainer.innerHTML = html;
            rationaleContainer.classList.remove('hidden');
        }

        function updateScore() {
            scoreText.innerText = `คะแนน: ${score}`;
        }

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert(`🎊 คุณทำแบบทดสอบเสร็จสิ้น!\nคะแนนรวมของคุณคือ: ${score} / ${questions.length}\nคุณสามารถใช้ "ผังข้อสอบ" เพื่อทบทวนเฉลยทุกข้อได้เลยครับ`);
            }
        };

        mapBtn.onclick = () => mapModal.classList.add('active');
        closeModalBtn.onclick = () => mapModal.classList.remove('active');
        
        function renderMap() {
            mapGrid.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-vector px-2 py-3 text-center text-base font-bold';
                btn.innerText = i + 1;
                
                if (userAnswers[i] !== null) {
                    if (userAnswers[i] === questions[i].answerIndex) {
                        btn.classList.add('btn-correct');
                    } else {
                        btn.classList.add('btn-wrong');
                    }
                } else if (i === currentIndex) {
                    btn.style.backgroundColor = '#1e3e62';
                    btn.style.color = '#ffffff';
                }

                btn.onclick = () => {
                    currentIndex = i;
                    renderQuestion();
                    mapModal.classList.remove('active');
                };
                mapGrid.appendChild(btn);
            }
        }

        renderQuestion();
    </script>
